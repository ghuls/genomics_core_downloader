# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: gcdl

before:
  hooks:
    - go mod tidy

builds:
  - id: gcdl
    main: ./cmd/gcdl
    binary: gcdl
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
